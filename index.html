<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập</title>

<style>

body{
background:#d8a9d6;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:sans-serif;
}

.container{
text-align:center;
}

/* avatar */
.avatar{
width:120px;
height:120px;
border-radius:10px;
object-fit:cover;
margin-bottom:20px;

animation: fadeIn 2s ease;
}

h1{
color:#b000b5;
letter-spacing:3px;
margin-bottom:20px;
}

/* box đăng nhập */
.box{
background:#f3e9f2;
padding:25px;
border-radius:15px;
width:280px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);

animation: slideUp 1.2s ease;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border-radius:8px;
border:1px solid #444;
font-size:16px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#e3b6e5;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

/* animation avatar */

@keyframes fadeIn{
0%{
opacity:0;
transform:scale(0.6);
}
100%{
opacity:1;
transform:scale(1);
}
}

/* animation box */

@keyframes slideUp{
0%{
opacity:0;
transform:translateY(50px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="container">

<img class="avatar" src="avatar.jpg">

<h1>ĐĂNG NHẬP</h1>

<div class="box">

<input type="text" placeholder="Tên">
<input type="password" id="pass" placeholder="Mật khẩu">

<button onclick="login()">XÁC NHẬN</button>

</div>

</div>

<script>

function login(){

var p=document.getElementById("pass").value;

if(p==="yeuem"){
window.location.href="page1.html";
}
else if(p==="voanh"){
window.location.href="page2.html";
}
else{
alert("Sai mật khẩu");
}

}

</script>

</body>
</html>
