<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>8/3</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#ffd6e7;
font-family:Arial;
overflow:hidden;
}

/* trái tim */
.heart{
position:absolute;
font-size:120px;
opacity:0;
animation:heartShow 2s forwards;
}

/* chữ */
.text{
position:absolute;
top:40%;
font-size:40px;
font-weight:bold;
color:#ff2e63;
opacity:0;
animation:textShow 2s forwards;
animation-delay:2s;
}

/* ô nhập */
.login{
position:absolute;
top:60%;
opacity:0;
animation:loginShow 2s forwards;
animation-delay:3s;
}

input{
padding:10px;
border-radius:10px;
border:none;
outline:none;
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
background:#ff4d88;
color:white;
cursor:pointer;
}

/* animation */

@keyframes heartShow{
0%{
opacity:0;
transform:translateY(50px) scale(0.5);
}
50%{
opacity:1;
transform:scale(1.2);
}
100%{
opacity:0;
transform:translateY(-150px) scale(0.8);
}
}

@keyframes textShow{
0%{
opacity:0;
transform:translateY(40px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

@keyframes loginShow{
0%{
opacity:0;
}
100%{
opacity:1;
}
}

</style>
</head>

<body>

<div class="heart">❤️</div>

<div class="text">
8/3 VUI NHA VỢ
</div>

<div class="login">
<input type="password" placeholder="Nhập mật khẩu">
<button>Vào</button>
</div>

</body>
</html>
</script>

</body>
</html>
