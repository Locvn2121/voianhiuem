<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
background:#cfa2cc;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:'Poppins',sans-serif;
}

/* container */

.container{
width:90%;
max-width:350px;
text-align:center;
}

/* avatar + chữ */

.top{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin-bottom:25px;
}

/* avatar */

.avatar{
width:70px;
height:70px;
border-radius:15px;
object-fit:cover;
}

/* chữ chúc */

.title{
font-family:'Pacifico',cursive;
font-size:28px;
color:#a000a8;
text-align:left;
}

/* chữ đăng nhập */

.login-title{
font-size:20px;
font-weight:600;
margin-bottom:15px;
}

/* box */

.box{
background:#e9dbe7;
padding:20px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

/* input */

input{
width:95%;
padding:12px;
margin-bottom:12px;
border-radius:8px;
border:1px solid #777;
font-size:15px;
}

/* button */

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#caa0c7;
font-weight:bold;
font-size:15px;
cursor:pointer;
}

button:hover{
background:#b788b3;
}

</style>
</head>

<body>

<div class="container">

<div class="top">
<img class="avatar" src="avatar.jpg">

<div class="title">
Chúc các vợ<br>8/3 vui vẻ nha
</div>
</div>

<div class="box">

<div class="login-title">
ĐĂNG NHẬP
</div>

<input type="text" placeholder="Tên">
<input type="password" id="pass" placeholder="Mật khẩu">

<button onclick="login()">XÁC NHẬN</button>

</div>

</div>

<script>

function login(){

var p=document.getElementById("pass").value;

if(p==="1812209"){
window.location.href="page1.html";
}
else if(p==="02012012"){
window.location.href="page2.html";
}
else{
alert("Sai mật khẩu");
}

}

</script>

</body>
</html>
