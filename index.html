<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập</title>

<style>

body{
background:#d8a9d6;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:sans-serif;
}

.container{
width:350px;
text-align:center;
}

/* phần avatar + chữ */

.top{
display:flex;
align-items:center;
justify-content:center;
margin-bottom:30px;
}

/* avatar */

.avatar{
width:120px;
height:120px;
border-radius:10px;
object-fit:cover;

animation: moveAvatar 2s forwards;
}

/* chữ */

.title{
font-size:26px;
font-weight:bold;
color:#b000b5;
margin-left:20px;

opacity:0;
animation: showText 2s forwards;
animation-delay:1.5s;
}

/* box */

.box{
background:#f3e9f2;
padding:25px;
border-radius:15px;
width:280px;
margin:auto;
box-shadow:0 10px 25px rgba(0,0,0,0.15);

opacity:0;
animation: slideUp 1.5s forwards;
animation-delay:2.5s;
}

input{
width:100%;
padding:12px;
margin-bottom:12px;
border-radius:8px;
border:1px solid #444;
font-size:16px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#e3b6e5;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

/* animation avatar */

@keyframes moveAvatar{
0%{
transform:translateX(60px);
}
100%{
transform:translateX(0);
}
}

/* chữ hiện */

@keyframes showText{
0%{
opacity:0;
transform:translateX(30px);
}
100%{
opacity:1;
transform:translateX(0);
}
}

/* box trượt */

@keyframes slideUp{
0%{
opacity:0;
transform:translateY(60px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>

<div class="container">

<div class="top">
<img class="avatar" src="avatar.jpg">
<div class="title">CHÚC CÁC VỢ 8/3 VUI VẺ</div>
</div>

<div class="box">

<input type="text" placeholder="Tên">
<input type="password" id="pass" placeholder="Mật khẩu">

<button onclick="login()">XÁC NHẬN</button>

</div>

</div>

<script>

function login(){
var p=document.getElementById("pass").value;

if(p==="yeuem"){
window.location.href="page1.html";
}
else if(p==="voanh"){
window.location.href="page2.html";
}
else{
alert("Sai mật khẩu");
}
}

</script>

</body>
</html>
